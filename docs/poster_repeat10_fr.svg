<svg xmlns="http://www.w3.org/2000/svg" width="841" height="1189" viewBox="0 0 841 1189" role="img" aria-labelledby="title desc">
  <title id="title">Affiche académique - Jumeau numérique de réseau pour SDN</title>
  <desc id="desc">Affiche scientifique en français, au format portrait, résumant le projet de jumeau numérique de réseau et les résultats mis à jour avec REPEAT=10.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f5; }
      .header { fill: #102a43; }
      .footer { fill: #153e75; }
      .card { fill: #ffffff; stroke: #c7d0d8; stroke-width: 1.2; }
      .section-bar { fill: #1f5a91; }
      .section-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #ffffff; }
      .title-main { font-family: Georgia, 'Times New Roman', serif; font-size: 30px; font-weight: 700; fill: #ffffff; }
      .title-sub { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 13px; fill: #d7e4f1; }
      .meta-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; fill: #7ea5ca; text-transform: uppercase; }
      .meta-value { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
      .h2 { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.6px; fill: #17324d; }
      .body { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; line-height: 1.35; fill: #243746; }
      .small { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10.5px; fill: #4c6170; }
      .caption { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; fill: #5f7384; }
      .bullet { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; fill: #243746; }
      .chip { fill: #eef4fa; stroke: #bfd0e2; stroke-width: 1; }
      .chip-alt { fill: #eef6f5; stroke: #bfd9d5; stroke-width: 1; }
      .chip-value { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #17324d; }
      .chip-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #557188; }
      .divider { stroke: #d6dde3; stroke-width: 1; }
      .num { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; font-weight: 700; fill: #1f5a91; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="841" height="1189"/>

  <g id="header">
    <rect class="header" x="0" y="0" width="841" height="146"/>
    <text class="meta-label" x="26" y="28">TER • SDN • JUMEAU NUMÉRIQUE</text>
    <text class="title-main" x="26" y="62">Jumeau numérique de réseau pour SDN :</text>
    <text class="title-main" x="26" y="96">validation expérimentale après extension à REPEAT=10</text>
    <text class="title-sub" x="26" y="121">Prototype sur Mininet + Open vSwitch + Ryu, avec synchronisation d'état, différentiel temporel et génération d'événements.</text>

    <text class="meta-label" x="585" y="36">Question</text>
    <text class="meta-value" x="585" y="58">Le jumeau détecte-t-il les changements</text>
    <text class="meta-value" x="585" y="76">de réseau de façon fiable et explicable ?</text>

    <text class="meta-label" x="585" y="101">Mise à jour clé</text>
    <text class="meta-value" x="585" y="123">Protocole principal porté de repeat=3 à repeat=10</text>
  </g>

  <g id="context">
    <rect class="card" x="24" y="170" width="251" height="182" rx="6"/>
    <rect class="section-bar" x="24" y="170" width="251" height="28" rx="6"/>
    <text class="section-title" x="36" y="189">PROBLÉMATIQUE ET OBJECTIF</text>
    <text class="body" x="38" y="220">
      <tspan x="38" dy="0">Le projet ne vise pas un simple tableau de bord réseau.</tspan>
      <tspan x="38" dy="18">L'objectif est de maintenir une image structurée du réseau,</tspan>
      <tspan x="38" dy="18">mise à jour via l'observation du contrôleur, puis comparée</tspan>
      <tspan x="38" dy="18">dans le temps pour produire des événements interprétables.</tspan>
    </text>
    <text class="bullet" x="38" y="302">• détecter panne et reprise de lien</text>
    <text class="bullet" x="38" y="320">• mesurer délai de détection et de reprise</text>
    <text class="bullet" x="38" y="338">• estimer l'impact du trafic de fond et du polling</text>
  </g>

  <g id="system">
    <rect class="card" x="24" y="365" width="251" height="220" rx="6"/>
    <rect class="section-bar" x="24" y="365" width="251" height="28" rx="6"/>
    <text class="section-title" x="36" y="384">CHAÎNE DU JUMEAU NUMÉRIQUE</text>
    <text class="num" x="39" y="425">1</text>
    <text class="body" x="60" y="425">Émulation du réseau dans Mininet + OVS</text>
    <text class="num" x="39" y="462">2</text>
    <text class="body" x="60" y="462">Observation temps réel via l'API REST de Ryu</text>
    <text class="num" x="39" y="499">3</text>
    <text class="body" x="60" y="499">Construction d'un <tspan font-style="italic">NetworkState</tspan> structuré</text>
    <text class="num" x="39" y="536">4</text>
    <text class="body" x="60" y="536">Différentiel entre états consécutifs et émission</text>
    <text class="body" x="60" y="553">d'événements <tspan font-weight="700">LINK_DOWN</tspan>, <tspan font-weight="700">LINK_UP</tspan> et <tspan font-weight="700">SYNC_ERROR</tspan></text>
    <line class="divider" x1="38" y1="565" x2="261" y2="565"/>
    <text class="small" x="38" y="587">Valeur scientifique :</text>
    <text class="small" x="38" y="603">le système apporte une sémantique temporelle</text>
    <text class="small" x="38" y="618">et historique, pas seulement une vue instantanée.</text>
  </g>

  <g id="protocol">
    <rect class="card" x="24" y="600" width="251" height="230" rx="6"/>
    <rect class="section-bar" x="24" y="600" width="251" height="28" rx="6"/>
    <text class="section-title" x="36" y="619">TOPOLOGIE ET PROTOCOLE</text>
    <image href="../data/plots/report/topology_geant8.png" x="36" y="640" width="227" height="104" preserveAspectRatio="xMidYMid meet"/>
    <text class="caption" x="36" y="758">Topologie principale : `geant_backbone_8cities_stage3` (8 villes, 10 liens).</text>
    <text class="bullet" x="36" y="783">• 3 scénarios : recovery, link flap, multi-fault</text>
    <text class="bullet" x="36" y="801">• 3 trafics : none, icmp, iperf_tcp</text>
    <text class="bullet" x="36" y="819">• polling fixe : 2.0 s pour l'expérience principale</text>
  </g>

  <g id="discussion">
    <rect class="card" x="24" y="845" width="251" height="250" rx="6"/>
    <rect class="section-bar" x="24" y="845" width="251" height="28" rx="6"/>
    <text class="section-title" x="36" y="864">DISCUSSION ET LIMITES</text>
    <text class="body" x="38" y="896">
      <tspan x="38" dy="0">Le passage à <tspan font-weight="700">repeat=10</tspan> ne change pas la direction</tspan>
      <tspan x="38" dy="18">des résultats ; il renforce leur crédibilité statistique.</tspan>
    </text>
    <text class="bullet" x="38" y="938">• boucle expérimentale complète : données, synthèse, figures</text>
    <text class="bullet" x="38" y="958">• distinction correcte entre panne physique et défaut d'observation</text>
    <text class="bullet" x="38" y="978">• architecture lisible et facilement réplicable pour un TER</text>
    <line class="divider" x1="38" y1="995" x2="261" y2="995"/>
    <text class="small" x="38" y="1018">Limites :</text>
    <text class="small" x="38" y="1036">Mininet + Ryu reste un environnement de simulation ;</text>
    <text class="small" x="38" y="1052">les expériences étendues ont moins de répétitions que</text>
    <text class="small" x="38" y="1068">la matrice principale et servent surtout à l'analyse de tendance.</text>
  </g>

  <g id="architecture">
    <rect class="card" x="295" y="170" width="251" height="265" rx="6"/>
    <rect class="section-bar" x="295" y="170" width="251" height="28" rx="6"/>
    <text class="section-title" x="307" y="189">ARCHITECTURE DU SYSTÈME</text>
    <image href="../data/plots/report/architecture.png" x="307" y="210" width="227" height="156" preserveAspectRatio="xMidYMid meet"/>
    <text class="caption" x="307" y="382">Quatre couches : émulation, observation, noyau jumeau, expérimentation/export.</text>
    <text class="small" x="307" y="404">Ressources observées : switches, liens, hôtes, ports, statistiques et flux.</text>
  </g>

  <g id="event-flow">
    <rect class="card" x="295" y="450" width="251" height="145" rx="6"/>
    <rect class="section-bar" x="295" y="450" width="251" height="28" rx="6"/>
    <text class="section-title" x="307" y="469">MÉCANISME D'ÉTAT ET D'ÉVÉNEMENTS</text>
    <text class="body" x="309" y="498">
      <tspan x="309" dy="0">1. interrogation de l'API Ryu ;</tspan>
      <tspan x="309" dy="18">2. construction d'un état structuré ;</tspan>
      <tspan x="309" dy="18">3. comparaison avec l'état précédent ;</tspan>
      <tspan x="309" dy="18">4. écriture des événements et des exports.</tspan>
    </text>
    <text class="small" x="309" y="579">Le jumeau suit donc des transitions, et non une simple photo instantanée du réseau.</text>
  </g>

  <g id="main-results">
    <rect class="card" x="295" y="610" width="251" height="325" rx="6"/>
    <rect class="section-bar" x="295" y="610" width="251" height="28" rx="6"/>
    <text class="section-title" x="307" y="629">RÉSULTATS PRINCIPAUX : MATRICE REPEAT=10</text>
    <image href="../data/plots/traffic_profile_repeat10_poster.png" x="307" y="648" width="227" height="138" preserveAspectRatio="xMidYMid meet"/>
    <text class="caption" x="307" y="800">La tendance la plus stable : le trafic de fond allonge surtout la détection, plus que la reprise.</text>

    <rect class="chip" x="307" y="815" width="69" height="54" rx="5"/>
    <text class="chip-label" x="319" y="833">DETECTION</text>
    <text class="chip-value" x="319" y="854">0.458 s</text>
    <text class="small" x="319" y="865">sans trafic</text>

    <rect class="chip" x="386" y="815" width="69" height="54" rx="5"/>
    <text class="chip-label" x="398" y="833">DETECTION</text>
    <text class="chip-value" x="398" y="854">1.144 s</text>
    <text class="small" x="398" y="865">sous ICMP</text>

    <rect class="chip-alt" x="465" y="815" width="69" height="54" rx="5"/>
    <text class="chip-label" x="476" y="833">REPRISE</text>
    <text class="chip-value" x="476" y="854">≈ 1.87 s</text>
    <text class="small" x="476" y="865">reste stable</text>

    <text class="bullet" x="307" y="894">• `link_flap` et `multi_fault` confirment la capacité à suivre plusieurs transitions</text>
    <text class="bullet" x="307" y="914">• les phases tardives montrent davantage de variance, signe d'un effet de convergence</text>
  </g>

  <g id="robust-findings">
    <rect class="card" x="295" y="950" width="251" height="145" rx="6"/>
    <rect class="section-bar" x="295" y="950" width="251" height="28" rx="6"/>
    <text class="section-title" x="307" y="969">ENSEIGNEMENTS ROBUSTES</text>
    <text class="bullet" x="309" y="1000">• la détection panne/reprise est stable dans la matrice principale</text>
    <text class="bullet" x="309" y="1020">• l'effet du trafic de fond survit au passage de repeat=3 à repeat=10</text>
    <text class="bullet" x="309" y="1040">• l'argument expérimental devient plus convaincant pour un rapport académique</text>
  </g>

  <g id="design">
    <rect class="card" x="566" y="170" width="251" height="180" rx="6"/>
    <rect class="section-bar" x="566" y="170" width="251" height="28" rx="6"/>
    <text class="section-title" x="578" y="189">PLAN EXPÉRIMENTAL</text>
    <text class="body" x="580" y="220">
      <tspan x="580" dy="0">Configuration de base :</tspan>
      <tspan x="580" dy="18">topologie `geant_backbone_8cities_stage3`,</tspan>
      <tspan x="580" dy="18">contrôleur `topology_aware_switch`,</tspan>
      <tspan x="580" dy="18">synchronisation `polling`, période 2.0 s.</tspan>
    </text>
    <rect class="chip" x="580" y="295" width="68" height="42" rx="5"/>
    <text class="chip-label" x="595" y="312">SCÉNARIOS</text>
    <text class="chip-value" x="607" y="330">3</text>
    <rect class="chip" x="657" y="295" width="68" height="42" rx="5"/>
    <text class="chip-label" x="676" y="312">TRAFICS</text>
    <text class="chip-value" x="684" y="330">3</text>
    <rect class="chip-alt" x="734" y="295" width="68" height="42" rx="5"/>
    <text class="chip-label" x="749" y="312">RÉPÉTITIONS</text>
    <text class="chip-value" x="751" y="330">10</text>
  </g>

  <g id="polling">
    <rect class="card" x="566" y="365" width="251" height="240" rx="6"/>
    <rect class="section-bar" x="566" y="365" width="251" height="28" rx="6"/>
    <text class="section-title" x="578" y="384">RÉSULTAT COMPLÉMENTAIRE : POLLING</text>
    <image href="../data/plots/polling_full_matrix_summary.png" x="578" y="406" width="227" height="120" preserveAspectRatio="xMidYMid meet"/>
    <text class="caption" x="578" y="540">Conclusion la plus monotone du projet : quand le polling ralentit, la reprise est confirmée plus tard.</text>
    <text class="bullet" x="578" y="565">• 1 s  → recovery mean = 0.968 s</text>
    <text class="bullet" x="578" y="583">• 2 s  → recovery mean = 1.958 s</text>
    <text class="bullet" x="578" y="601">• 4 s  → recovery mean = 3.874 s</text>
  </g>

  <g id="extended">
    <rect class="card" x="566" y="620" width="251" height="180" rx="6"/>
    <rect class="section-bar" x="566" y="620" width="251" height="28" rx="6"/>
    <text class="section-title" x="578" y="639">ROBUSTESSE SÉMANTIQUE ET ÉCHELLE</text>
    <text class="bullet" x="580" y="673">• Dégradation d'observation : émission de `SYNC_ERROR`, pas de faux `LINK_DOWN`</text>
    <text class="bullet" x="580" y="693">• Topologie plus complexe : détection 0.628 → 0.725 s</text>
    <text class="bullet" x="580" y="713">• Reprise 1.991 → 2.300 s entre Geant8 et Geant2012_core12</text>
    <image href="../data/plots/p34_full_matrix_summary.png" x="578" y="728" width="227" height="58" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="conclusion">
    <rect class="card" x="566" y="815" width="251" height="280" rx="6"/>
    <rect class="section-bar" x="566" y="815" width="251" height="28" rx="6"/>
    <text class="section-title" x="578" y="834">CONCLUSION</text>
    <text class="body" x="580" y="865">
      <tspan x="580" dy="0">Le projet valide un PoC de jumeau numérique pour SDN</tspan>
      <tspan x="580" dy="18">capable d'observer, structurer, comparer et expliquer</tspan>
      <tspan x="580" dy="18">les changements d'état d'un réseau expérimental.</tspan>
    </text>
    <text class="bullet" x="580" y="926">• détection stable des pannes et des reprises</text>
    <text class="bullet" x="580" y="946">• sensibilité nette au trafic de fond</text>
    <text class="bullet" x="580" y="966">• effet monotone du polling sur la reprise</text>
    <text class="bullet" x="580" y="986">• bonne séparation entre faute d'observation et faute physique</text>
    <text class="bullet" x="580" y="1006">• base plus solide pour un rapport TER ou une soutenance</text>
    <line class="divider" x1="580" y1="1024" x2="803" y2="1024"/>
    <text class="small" x="580" y="1048">Prochaine étape raisonnable :</text>
    <text class="small" x="580" y="1066">étendre les répétitions des expériences complémentaires</text>
    <text class="small" x="580" y="1082">et tester des topologies ou contrôleurs plus proches du réel.</text>
  </g>

  <g id="footer">
    <rect class="footer" x="0" y="1130" width="841" height="59"/>
    <text class="title-sub" x="26" y="1154">Source structurante : /docs/report_cn_repeat10.md</text>
    <text class="title-sub" x="26" y="1173">Affiche synthétique rédigée en français à partir du rapport de résultats mis à jour.</text>
  </g>
</svg>
